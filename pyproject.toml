[project]
name = "invoice-core"
version = "0.1.0"
description = "LLM document extraction for bookkeeping: extraction guardrails, dedup, VAT and accounting export for Greek bookkeeping"
requires-python = ">=3.11"
dependencies = ["pypdf>=4", "openpyxl>=3.1"]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["invoice_core"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
